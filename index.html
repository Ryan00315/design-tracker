<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMS - 設計課專案進度追蹤系統</title>
  <link rel="stylesheet" href="style.css">
  <!-- 甘特圖套件 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.css">
</head>
<body>

  <!-- 1. 登入介面 (Kingtex 風格) -->
  <div id="auth-section" class="login-screen">
    <div class="login-box">
      <div class="brand-logo-area">
        <div class="logo-icon">P</div>
        <div>
          <div class="brand-title">PMS 管理系統</div>
          <div style="font-size: 12px; color: var(--text-muted);">設計部專案進度追蹤平台</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">登入帳號 (Email)</label>
        <input type="email" id="login-email" class="input-control" placeholder="例：Ryan@design.com">
      </div>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input type="password" id="login-password" class="input-control" placeholder="輸入密碼">
      </div>
      <button id="btn-login" class="btn-primary" style="margin-top: 8px;">登入系統</button>
    </div>
  </div>

  <!-- 2. 主工作後台 (PMS Layout) -->
  <div id="app-section" class="app-container" style="display:none;">
    
    <!-- 左側深色導航列 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon" style="width: 28px; height: 28px; font-size: 14px;">P</div>
        <span>PMS System</span>
        <span class="version-tag">v2.1</span>
      </div>
      <ul class="nav-list">
        <li class="nav-item active" onclick="switchNav('tab-projects', '專案進度追蹤 (甘特圖)', this)">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg>
          <span>專案進度甘特圖</span>
        </li>
        <li class="nav-item" onclick="switchNav('tab-adhoc', '臨時事件紀錄', this)">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span>臨時事件紀錄</span>
        </li>
        <li class="nav-item" onclick="switchNav('tab-weekly', '每週進度週報', this)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>每週進度週報</span>
        </li>
      </ul>
    </aside>

    <!-- 右側主工作區 -->
    <div class="main-wrapper">
      <!-- 頂部資訊列 -->
      <header class="top-header">
        <div class="breadcrumb">PMS / <b id="current-title">專案進度追蹤 (甘特圖)</b></div>
        <div class="header-right">
          <div class="time-badge" id="live-time">2026-08-18</div>
          <div class="user-info-box">
            <div class="avatar" id="user-avatar">R</div>
            <div>
              <div id="user-display-name" style="font-size: 13px; font-weight: 600;">Ryan</div>
              <span id="user-role-badge" class="role-badge">ADMIN</span>
            </div>
          </div>
          <button id="btn-logout" class="btn-logout">登出</button>
        </div>
      </header>

      <!-- 內容視窗 -->
      <main class="content-body">

        <!-- 分頁 1：專案進度與甘特圖 -->
        <div id="tab-projects" class="tab-pane">
          <!-- KPI 數據卡 -->
          <div class="kpi-row">
            <div class="kpi-card">
              <div class="kpi-title">進行中任務</div>
              <div class="kpi-number" id="stat-ongoing">0</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-title">已完成任務</div>
              <div class="kpi-number" id="stat-completed" style="color: var(--success);">0</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-title">延遲 (Delay) 項目</div>
              <div class="kpi-number" id="stat-delay" style="color: var(--danger);">0</div>
            </div>
          </div>

          <!-- 建立專案表單 -->
          <div class="section-panel">
            <div class="panel-head">建立專案規劃（上傳後系統自動鎖定）</div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">專案名稱</label>
                <input type="text" id="proj-name" class="input-control" placeholder="例：2026 產品結構改版案">
              </div>
              <div class="form-group">
                <label class="form-label">細項任務名稱</label>
                <input type="text" id="task-name" class="input-control" placeholder="例：3D 樣品繪製">
              </div>
              <div class="form-group">
                <label class="form-label">預計起始日</label>
                <input type="date" id="task-start" class="input-control">
              </div>
              <div class="form-group">
                <label class="form-label">預計完成日</label>
                <input type="date" id="task-end" class="input-control">
              </div>
            </div>
            <button id="btn-add-project" class="btn-primary" style="width: 160px; margin-top: 6px;">提交並鎖定</button>
          </div>

          <!-- 甘特圖 -->
          <div class="section-panel">
            <div class="panel-head">甘特圖時程檢視</div>
            <div id="gantt-chart" style="overflow-x: auto; padding: 10px 0;"></div>
          </div>

          <!-- 專案列表表格 -->
          <div class="section-panel">
            <div class="panel-head">專案列表資料</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>專案 / 細項</th>
                    <th>負責人</th>
                    <th>預計期程</th>
                    <th>狀態</th>
                    <th>完成/Delay 紀錄</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="project-list-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 分頁 2：臨時插單事件 -->
        <div id="tab-adhoc" class="tab-pane" style="display:none;">
          <div class="section-panel">
            <div class="panel-head">登記臨時插單事件</div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">事項名稱</label>
                <input type="text" id="adhoc-title" class="input-control" placeholder="緊急樣品修改">
              </div>
              <div class="form-group">
                <label class="form-label">原因說明</label>
                <input type="text" id="adhoc-reason" class="input-control" placeholder="客戶尺寸變更">
              </div>
            </div>
            <button id="btn-add-adhoc" class="btn-primary" style="width: 160px; margin-top: 6px;">登記插單事件</button>
          </div>
          <div class="section-panel">
            <div class="panel-head">臨時事件追蹤清單</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>事項</th>
                    <th>原因說明</th>
                    <th>登記時間</th>
                    <th>狀態</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="adhoc-list-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 分頁 3：週報 -->
        <div id="tab-weekly" class="tab-pane" style="display:none;">
          <div class="section-panel">
            <div class="panel-head">填寫本週工作週報</div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
              <div class="form-group">
                <label class="form-label">起始日期</label>
                <input type="date" id="rep-start" class="input-control">
              </div>
              <div class="form-group">
                <label class="form-label">結束日期</label>
                <input type="date" id="rep-end" class="input-control">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">本週進度說明</label>
              <textarea id="rep-content" class="input-control" rows="5" placeholder="條列本週進度、遭遇問題與下週規劃..."></textarea>
            </div>
            <button id="btn-add-weekly" class="btn-primary" style="width: 160px;">送出週報</button>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
