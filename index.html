<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMS - 設計課專案管理系統</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.css">
</head>
<body>

  <!-- 1. 登入介面 -->
  <div id="auth-section" class="login-screen">
    <div class="login-box">
      <div class="brand-logo-area"><div class="logo-icon">P</div><div><div class="brand-title">PMS 管理系統</div><div style="font-size: 12px; color: var(--text-muted);">設計部專案進度追蹤平台</div></div></div>
      <div class="form-group"><label class="form-label">登入帳號 (Email)</label><input type="email" id="login-email" class="input-control" placeholder="例：Ryan@design.com"></div>
      <div class="form-group"><label class="form-label">密碼</label><input type="password" id="login-password" class="input-control" placeholder="輸入密碼"></div>
      <button id="btn-login" class="btn-primary" style="margin-top: 8px;">登入系統</button>
    </div>
  </div>

  <!-- 2. 主工作後台 -->
  <div id="app-section" class="app-container" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="logo-icon" style="width: 28px; height: 28px; font-size: 14px;">P</div><span>PMS System</span><span class="version-tag">v4.1</span></div>
      <ul class="nav-list">
        <li class="nav-item active" onclick="switchNav('tab-projects', '專案進度', this)">
          <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 9l-5 5-4-4-3 3"/></svg><span>專案進度</span>
        </li>
        <li class="nav-item" onclick="switchNav('tab-adhoc', '事件紀錄', this)">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>事件紀錄</span>
        </li>
        <li class="nav-item" onclick="switchNav('tab-weekly', '週報填寫', this)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>週報填寫</span>
        </li>
        
        <!-- 分隔線 (Admin 專屬) -->
        <li class="nav-divider" id="nav-divider-org" style="display:none;"></li>
        <li class="nav-item" id="nav-org-manage" style="display:none;" onclick="switchNav('tab-org', '組織架構與人員管理', this)">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>組織架構管理</span>
        </li>
      </ul>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="breadcrumb">PMS / <b id="current-title">專案進度</b></div>
        <div class="header-right">
          <div class="user-info-box">
            <div class="avatar" id="user-avatar">R</div>
            <div><div id="user-display-name" style="font-size: 13px; font-weight: 600;">Ryan</div><span id="user-role-badge" class="role-badge">ADMIN</span></div>
          </div>
          <button class="btn-icon" onclick="switchNav('tab-profile', '個人帳號設定', null)" title="個人帳號設定">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </button>
          <button id="btn-logout" class="btn-logout">登出</button>
        </div>
      </header>

      <main class="content-body">
        
        <!-- 分頁 1：專案進度 -->
        <div id="tab-projects" class="tab-pane">
          <!-- 頂部數據跳轉 與 新增按鈕 -->
          <div style="display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 24px; gap: 20px;">
            <div class="kpi-row" style="margin: 0;">
              <div class="kpi-card active" id="filter-ongoing" onclick="setProjectFilter('ongoing')">
                <div class="kpi-title">未完成專案</div>
                <div class="kpi-number" id="stat-ongoing">0</div>
              </div>
              <div class="kpi-card" id="filter-completed" onclick="setProjectFilter('completed')">
                <div class="kpi-title">已完成專案</div>
                <div class="kpi-number" id="stat-completed" style="color: var(--success);">0</div>
              </div>
              <div class="kpi-card" id="filter-delayed" onclick="setProjectFilter('delayed')">
                <div class="kpi-title">延遲 (Delay) 專案</div>
                <div class="kpi-number" id="stat-delay" style="color: var(--danger);">0</div>
              </div>
            </div>
            <div style="display: flex; align-items: center;">
              <button id="btn-toggle-create" class="btn-primary" style="height: 100%; padding: 0 24px; font-size: 15px;">➕ 新增專案規劃</button>
            </div>
          </div>

          <!-- 新增專案區塊 -->
          <div id="create-project-section" class="section-panel" style="display:none; border: 2px solid var(--primary-soft);">
            <div class="panel-head">建立專案與任務規劃 (送出後即鎖定)</div>
            <div class="form-group"><label class="form-label">主專案名稱</label><input type="text" id="proj-name" class="input-control" placeholder="例：2026 產品外觀設計案" style="max-width: 400px;"></div>
            <div style="margin-top: 20px; margin-bottom: 10px; font-weight: 600; font-size: 14px; color: #334155;">任務細項排程 (系統自動避開週末)</div>
            <div id="task-list-container"></div>
            <button class="action-btn" onclick="addTaskRow()" style="margin-top: 10px; border-style: dashed;">+ 新增任務細項</button>
            <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px;"><button id="btn-add-project" class="btn-primary" style="width: 180px;">送出並鎖定專案</button></div>
          </div>

          <!-- 專案切換分頁 (Tabs) -->
          <div class="project-tabs-wrapper" id="project-tabs-container"></div>

          <!-- 完美的甘特圖並排佈局 -->
          <div id="project-detail-view" style="display:none;">
            <div class="section-panel" style="padding: 0; background: transparent; border: none; box-shadow: none;">
              <div class="panel-head" style="margin-bottom: 8px;">
                <span id="current-gantt-title">專案時程檢視</span>
                <button id="btn-toggle-lock" class="action-btn danger" style="display:none;" onclick="toggleCurrentProjectLock()"></button>
              </div>
              
              <!-- 核心左右連動佈局 -->
              <div class="gantt-master-layout">
                <!-- 左側固定列表 -->
                <div class="gantt-left-panel">
                  <div class="gantt-head">
                    <div class="col-name">細項名稱</div>
                    <div class="col-date">預計期程</div>
                    <div class="col-prog">進度</div>
                    <div class="col-act">確認</div>
                  </div>
                  <div class="gantt-body" id="gantt-left-body"></div>
                </div>
                <!-- 右側 SVG 甘特圖外層包覆防縮小容器 -->
                <div class="gantt-right-panel" id="gantt-chart-container">
                  <div id="gantt-chart"></div>
                </div>
              </div>
            </div>
          </div>
          
          <div id="empty-state" style="text-align: center; padding: 40px; color: var(--text-muted); display: none;">此分類下目前沒有專案。</div>
        </div>

        <!-- 分頁 2：事件紀錄 -->
        <div id="tab-adhoc" class="tab-pane" style="display:none;">
          <div class="section-panel">
            <div class="panel-head">登記臨時插單事件</div>
            <div class="form-row">
              <div class="form-group" style="flex:1;"><label class="form-label">事項名稱</label><input type="text" id="adhoc-title" class="input-control" placeholder="緊急樣品修改"></div>
              <div class="form-group" style="flex:2;"><label class="form-label">原因說明</label><input type="text" id="adhoc-reason" class="input-control" placeholder="客戶尺寸變更"></div>
            </div>
            <button id="btn-add-adhoc" class="btn-primary" style="width: 160px; margin-top: 6px;">登記插單事件</button>
          </div>
          <div class="section-panel">
            <div class="panel-head">事件紀錄清單</div>
            <div class="table-responsive">
              <table>
                <thead><tr><th>事項</th><th>原因說明</th><th>登記時間</th><th>狀態</th><th>操作</th></tr></thead>
                <tbody id="adhoc-list-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 分頁 3：週報填寫 -->
        <div id="tab-weekly" class="tab-pane" style="display:none;">
          <div class="section-panel">
            <div class="panel-head">填寫本週工作週報</div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
              <div class="form-group"><label class="form-label">起始日期</label><input type="date" id="rep-start" class="input-control"></div>
              <div class="form-group"><label class="form-label">結束日期</label><input type="date" id="rep-end" class="input-control"></div>
            </div>
            <div class="form-group">
              <label class="form-label">本週進度說明</label>
              <textarea id="rep-content" class="input-control" rows="5" placeholder="條列本週進度、遭遇問題與下週規劃..."></textarea>
            </div>
            <button id="btn-add-weekly" class="btn-primary" style="width: 160px;">送出週報</button>
          </div>
        </div>

        <!-- 分頁 4：組織架構與人員管理 -->
        <div id="tab-org" class="tab-pane" style="display:none;">
          <div class="section-panel">
            <div class="panel-head">新增人員與職稱階層設定</div>
            <div class="form-row">
              <div class="form-group" style="flex:1;"><label class="form-label">姓名</label><input type="text" id="new-user-name" class="input-control" placeholder="例：林設計師"></div>
              <div class="form-group" style="flex:1.5;"><label class="form-label">登入帳號 (Email)</label><input type="email" id="new-user-email" class="input-control" placeholder="例：lin@design.com"></div>
              <div class="form-group" style="flex:1;"><label class="form-label">預設密碼</label><input type="password" id="new-user-pass" class="input-control" placeholder="設定至少 6 碼"></div>
              <div class="form-group" style="flex:1;"><label class="form-label">組織階層職稱</label>
                <select id="new-user-role" class="input-control">
                  <option value="staff">人員 (Staff)</option><option value="assistant_manager">副主管 (Assistant Manager)</option><option value="manager">主管 (Manager)</option><option value="top_manager">高級主管 (Top Manager)</option><option value="admin">系統管理員 (Admin)</option>
                </select>
              </div>
              <div class="form-group" style="flex:1;"><label class="form-label">直屬主管</label><select id="new-user-supervisor" class="input-control"><option value="">-- 無 --</option></select></div>
            </div>
            <button id="btn-create-user" class="btn-primary" style="width: 180px; margin-top: 6px;">建立人員帳號</button>
          </div>
          <div class="section-panel">
            <div class="panel-head">組織人員名單與管理</div>
            <div class="table-responsive">
              <table>
                <thead><tr><th>姓名</th><th>帳號 (Email)</th><th>組織階層</th><th>直屬主管</th><th>操作</th></tr></thead>
                <tbody id="user-list-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 分頁 5：個人帳號設定 -->
        <div id="tab-profile" class="tab-pane" style="display:none;">
          <div class="section-panel" style="max-width: 600px;">
            <div class="panel-head">變更登入密碼</div>
            <div class="form-group"><label class="form-label">新密碼</label><input type="password" id="profile-new-pass" class="input-control" placeholder="輸入新密碼 (至少 6 位數)"></div>
            <div class="form-group"><label class="form-label">確認新密碼</label><input type="password" id="profile-confirm-pass" class="input-control" placeholder="再次輸入新密碼"></div>
            <button id="btn-update-password" class="btn-primary" style="width: 160px;">更新密碼</button>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
